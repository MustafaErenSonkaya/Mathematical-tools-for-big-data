# docker compose up --build
#   app        -> http://localhost:8000/metrics
#   prometheus -> http://localhost:9090
#   grafana    -> http://localhost:3000
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data            # alerts.jsonl survives restarts

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus   # time-series database
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Fails fast with a clear message if .env is missing the password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # anyone can view without logging in...
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer    # ...but only view, not edit
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/outlier-detection.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana       # users, sessions, preferences
    depends_on:
      - prometheus

# Named volumes are managed by Docker and survive `docker compose down`
# (only `docker compose down -v` deletes them).
volumes:
  app-data:
  prometheus-data:
  grafana-data:
